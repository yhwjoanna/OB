<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>期末專題分組名單｜組織行為 HRM912</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F1F1EC">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  color-scheme:light;
  --paper:#F1F1EC; --card:#FBFBF7; --sunk:#E7E7E0;
  --ink:#171614; --text:#171614; --muted:#55524B; --faint:#6B675E;
  --red:#D0221B;
  --line:rgba(23,22,20,.10); --line-2:rgba(23,22,20,.20);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
  --sh:0 .5px 1px rgba(23,22,20,.05), 0 2px 6px rgba(23,22,20,.045);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);
  font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
  padding:clamp(1.25rem,4vw,2.5rem) 16px 4rem}
.wrap{max-width:1080px;margin:0 auto}

.back{display:inline-flex;align-items:center;gap:.4rem;font:600 .8125rem/1 var(--sans);
  color:var(--muted);text-decoration:none;padding:.5rem .8rem;border:1px solid var(--line-2);
  border-radius:999px;background:var(--card);transition:transform .1s ease-out,border-color .15s}
.back:hover{border-color:var(--text);color:var(--text)}
.back:active{transform:scale(.97)}

header{margin:1.5rem 0 .5rem}
.kick{font:600 .6875rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
h1{margin:.6rem 0 0;font-size:clamp(1.6rem,4.5vw,2.25rem);font-weight:600;letter-spacing:-.02em;line-height:1.2}
.meta{margin:.65rem 0 0;font:400 .8125rem/1.7 var(--mono);letter-spacing:.04em;color:var(--faint)}
.lede{margin:1rem 0 0;max-width:46rem;font-size:.9375rem;color:var(--muted);text-wrap:pretty}

.grid{display:grid;gap:1rem;margin-top:2rem;align-items:start;
  grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.g{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:1.1rem 1.15rem 1.2rem}
.g .hd{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;
  padding-bottom:.6rem;border-bottom:1px solid var(--line)}
.g .hd b{font-size:1.0625rem;font-weight:600;letter-spacing:-.01em}
.g .hd span{font:400 .6875rem/1 var(--mono);letter-spacing:.08em;color:var(--faint)}
ul{list-style:none;margin:.55rem 0 0;padding:0}
li{display:flex;align-items:center;gap:.5rem;padding:.38rem 0;font-size:.9375rem}
li + li{border-top:1px solid rgba(23,22,20,.05)}
li .nm{font-weight:400}
li.lead .nm{font-weight:600}
li .role{flex:none;width:2.4rem;font:600 .625rem/1 var(--mono);letter-spacing:.06em;color:var(--faint)}
li.lead .role{color:var(--red)}
li .cls{margin-left:auto;flex:none;font:400 .6875rem/1 var(--sans);color:var(--faint);
  padding:.22rem .45rem;border:1px solid var(--line-2);border-radius:6px;background:var(--sunk)}

.note{margin-top:2.25rem;padding-top:1rem;border-top:1px solid var(--line);
  font-size:.8125rem;line-height:1.75;color:var(--faint);max-width:46rem;text-wrap:pretty}
.note a{color:var(--muted);text-underline-offset:.2em}
.note a:hover{color:var(--text)}

@media (prefers-contrast: more){.g,.back,li .cls{border-width:1.5px}}
@media (prefers-reduced-motion: reduce){.back:active{transform:none}}
@media print{.back{display:none}body{padding:0}.g{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">‹ 回課程首頁</a>

  <header>
    <div class="kick">HRM912 ── 期末專題</div>
    <h1>期末專題分組名單</h1>
    <div class="meta" id="meta">7 組 ── 38 人 ── 更新 2026.09.20</div>
    <p class="lede">名單依教務系統選課名冊與推廣教育學分班名冊核對。組長負責組內聯繫、繳交與抽籤，各組主題由課堂抽籤決定，組別之間不重複。</p>
  </header>

  <div class="grid" id="grid"></div>

  <p class="note">姓名或班別有誤請於 <a href="https://classroom.google.com/c/ODcyNzY2NjQ2OTM0?cjc=jom37a4a" target="_blank" rel="noopener noreferrer">Google Classroom</a> 回報。本頁僅供修課學生使用，未開放搜尋引擎收錄。</p>
</div>

<script>
(function () {
  var GROUPS = [
    { n: '第一組', m: [['盧箏英','學分班',1],['蕭佩瑜','學分班',0],['黃思萍','學分班',0],['黃筱晴','專班',0],['李怡靜','專班',0]] },
    { n: '第二組', m: [['劉映君','學分班',1],['楊凱婷','學分班',0],['何宥諠','學分班',0],['陳玟汝','專班',0],['吳思翰','專班',0],['林雅雯','專班',0],['李郁婷','專班',0]] },
    { n: '第三組', m: [['陳建達','專班',1],['王翊丞','專班',0],['陳品婷','專班',0],['陳加瑋','專班',0],['徐華榛','學分班',0]] },
    { n: '第四組', m: [['李若瑄','專班',1],['林貝珊','專班',0],['王怡涵','專班',0],['簡湧晟','學分班',0],['余雅蓉','學分班',0]] },
    { n: '第五組', m: [['吳秋慧','學分班',1],['陳凱謙','學分班',0],['胡恣瑄','學分班',0],['陳慧慈','專班',0],['林螢詩','專班',0]] },
    { n: '第六組', m: [['陳姵妤','學分班',1],['林于倩','專班',0],['夏瑤','專班',0],['侯順耀','專班',0],['謝道正','學分班',0],['趙心慈','專班',0]] },
    { n: '第七組', m: [['劉家宏','專班',1],['王喻玫','專班',0],['張世彥','專班',0],['楊茲羽','專班',0],['鍾佩樺','專班',0]] }
  ];

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }

  var grid = document.getElementById('grid'), total = 0;
  GROUPS.forEach(function (g) {
    total += g.m.length;
    var box = el('div', 'g');
    var hd = el('div', 'hd');
    hd.appendChild(el('b', null, g.n));
    hd.appendChild(el('span', null, g.m.length + ' 人'));
    box.appendChild(hd);
    var ul = el('ul');
    g.m.forEach(function (p) {
      var li = el('li', p[2] ? 'lead' : null);
      li.appendChild(el('span', 'role', p[2] ? '組長' : '組員'));
      li.appendChild(el('span', 'nm', p[0]));
      li.appendChild(el('span', 'cls', p[1]));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    grid.appendChild(box);
  });
  document.getElementById('meta').textContent = GROUPS.length + ' 組 ── ' + total + ' 人 ── 更新 2026.09.20';
})();
</script>
</body>
</html>
