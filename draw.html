<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F4F3EE">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>期末專題選題抽籤</title>
<style>
  .backbar{max-width:1180px;margin:0 auto 14px}
  .backbar a{display:inline-flex;align-items:center;gap:.4rem;text-decoration:none;
    font:600 13px/1 var(--sans);color:#55524B;background:var(--card);
    border:1px solid var(--line);border-radius:999px;padding:8px 13px;
    transition:transform .1s ease-out,border-color .15s}
  .backbar a:hover{border-color:var(--ink);color:var(--ink)}
  .backbar a:active{transform:scale(.97)}
  @media (prefers-reduced-motion: reduce){.backbar a:active{transform:none}}
  @media print{.backbar{display:none}}

  :root{
    --paper:#F4F3EE; --card:#FBFBF7; --ink:#232320; --gray:#8A8A82;
    --line:rgba(35,35,32,.18); --red:#D0221B;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--sans);
    padding:20px 22px 40px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto}

  .top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
  .top h1{font-size:26px;font-weight:900;margin:0;letter-spacing:.01em}
  .top .en{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--gray)}
  .top .spacer{flex:1}
  .top .meta{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--gray)}

  h2{font-size:12px;font-family:var(--mono);letter-spacing:.14em;color:var(--gray);
    font-weight:700;margin:0 0 8px;text-transform:uppercase}

  /* 主題晶片 */
  .topics{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  .chip{border:1.5px solid var(--ink);background:var(--card);padding:9px 14px;
    font-size:16px;font-weight:700;line-height:1.2;border-radius:2px;
    display:flex;align-items:center;gap:8px;transition:none}
  .chip .num{font-family:var(--mono);font-size:11px;color:var(--gray)}
  .chip.taken{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip.taken .num{color:rgba(244,243,238,.7)}
  .chip.pickable{cursor:pointer;border-color:var(--red);color:var(--red)}
  .chip.pickable:hover{background:var(--red);color:#fff}

  /* 抽籤台 */
  .stage{border:2px solid var(--ink);background:var(--card);padding:22px 24px;margin-bottom:20px}
  .stage .slot{font-size:46px;font-weight:900;line-height:1.2;letter-spacing:.02em;min-height:62px}
  .stage .slot .dim{color:var(--gray);font-weight:700;font-size:28px}
  .stage .got{margin-top:10px;font-size:22px;font-weight:700;min-height:34px}
  .stage .got b{color:var(--red)}
  .stage .got .rank{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--gray);margin-left:8px}
  .stage .hint{margin-top:10px;font-size:14px;color:var(--gray);min-height:22px}
  .bar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
  button{font:inherit;cursor:pointer;border:1.5px solid var(--ink);background:var(--card);
    color:var(--ink);padding:11px 20px;font-weight:700;font-size:16px;border-radius:2px}
  button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
  button:disabled{opacity:.35;cursor:default}
  button.go{background:var(--red);color:#fff;border-color:var(--red)}
  button.go:hover:not(:disabled){background:#A81A15;border-color:#A81A15;color:#fff}
  .count{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--gray)}
  .sw{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);cursor:pointer;user-select:none}
  .sw input{width:16px;height:16px;accent-color:var(--red);cursor:pointer}
  .why{margin-top:8px;font-size:13.5px;line-height:1.6;color:var(--gray);
    border-left:3px solid var(--red);padding:2px 0 2px 10px;display:none}
  .why.on{display:block}
  .why b{color:var(--ink);font-weight:700}
  .warn{border:1.5px solid var(--red);background:#FFF4F3;color:var(--ink);
    padding:10px 14px;font-size:14px;margin-bottom:16px;display:none}
  .warn.on{display:block}

  .rule{display:flex;align-items:flex-start;gap:16px;background:var(--card);
    border:1px solid var(--line);border-left:3px solid var(--ink);
    padding:12px 16px;margin-bottom:20px}
  .rule .lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--gray);
    font-weight:700;white-space:nowrap;padding-top:3px}
  .rule ol{margin:0;padding:0;list-style:none;display:grid;
    grid-template-columns:repeat(3,1fr);gap:6px 22px;flex:1;counter-reset:r}
  .rule li{font-size:14px;line-height:1.6;color:var(--gray);padding-left:20px;position:relative;
    counter-increment:r;text-wrap:pretty}
  .rule li::before{content:counter(r);position:absolute;left:0;top:0;
    font-family:var(--mono);font-size:11px;font-weight:700;color:var(--red);
    line-height:1.95;letter-spacing:.08em}
  .rule li b{color:var(--ink);font-weight:700}
  @media (max-width:980px){.rule{flex-direction:column;gap:8px}
    .rule ol{grid-template-columns:1fr}}
  .prefs span.skip{color:#BDBDB5;border-bottom:1px dashed #BDBDB5}

  /* 表格 */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  table{width:100%;border-collapse:collapse;background:var(--card)}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;font-size:15px}
  th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--gray);font-weight:700;
    background:var(--paper);white-space:nowrap}
  td.g{font-weight:900;white-space:nowrap}
  td.lead{white-space:nowrap;color:var(--gray)}
  .prefs span{display:inline-block;margin:1px 0}
  .prefs span::after{content:'　▸ ';color:var(--gray);font-weight:400}
  .prefs span:last-child::after{content:''}
  .prefs span.used{text-decoration:line-through;color:#BDBDB5}
  .prefs span.mine{color:var(--red);font-weight:900;text-decoration:none}
  .prefs span.add::before{content:'＋';color:var(--gray);font-weight:400;margin-right:1px}
  tr.done td{background:#F0EFE9}
  tr.now td{background:#FFF4F3}
  .res td.t{font-weight:900}
  .empty{color:var(--gray);font-size:14px;padding:10px 2px}
  @media (max-width:860px){.cols{grid-template-columns:1fr}.stage .slot{font-size:34px}}
  @media print{button,.bar{display:none}}
</style>
</head>
<body>

<div class="backbar"><a href="index.html">‹ 回課程首頁</a></div>
<div class="wrap">
  <div class="top">
    <h1>期末專題選題抽籤</h1>
    <span class="en">DRAW &amp; PICK</span>
    <span class="spacer"></span>
    <span class="meta">HRM912 ／ 台北在職專班・學分班</span>
  </div>

  <div class="warn" id="warn"></div>

  <div class="rule" id="rule">
    <span class="lab">抽籤規則</span>
    <ol>
      <li><b>順序隨機。</b>每次從還沒抽到的組別中隨機抽一組。</li>
      <li id="r2"></li>
      <li id="r3"></li>
    </ol>
  </div>

  <h2 id="thead">主題</h2>
  <div class="topics" id="topics"></div>

  <div class="stage">
    <div class="slot" id="slot"><span class="dim">按下抽籤，決定第 1 順位</span></div>
    <div class="got" id="got"></div>
    <div class="hint" id="hint">抽到的組別，直接取走它志願序中還沒被選走的最前面一個。</div>
    <div class="why" id="why"></div>
    <div class="bar">
      <button class="go" id="draw">抽籤</button>
      <button id="reset">重新開始</button>
      <button id="copy">複製結果</button>
      <label class="sw"><input type="checkbox" id="guard" checked><span>保障每組都拿到志願內的主題</span></label>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div class="cols">
    <div>
      <h2>各組志願序</h2>
      <table id="ptab"><thead><tr><th>組別</th><th>組長</th><th>志願序</th></tr></thead><tbody></tbody></table>
    </div>
    <div>
      <h2>抽籤結果</h2>
      <table class="res" id="rtab"><thead><tr><th>順位</th><th>組別</th><th>組長</th><th>主題</th><th>志願</th></tr></thead><tbody></tbody></table>
      <div class="empty" id="rempty">尚未開始。</div>
    </div>
  </div>
</div>

<script>
/* ── 資料 ───────────────────────────────────────────── */
var TOPICS = ['心理安全感','工作倦怠','心理資本','工作敬業','印象管理',
              '職場八卦','工作塑造','職場無禮','自我監控'];

var GROUPS = [
  { n:'第一組', lead:'盧箏英', prefs:['印象管理','工作倦怠','工作敬業','職場八卦','心理安全感'] },
  { n:'第二組', lead:'劉映君', prefs:['職場八卦','印象管理','工作倦怠','心理安全感'] },
  { n:'第三組', lead:'陳建達', prefs:['心理安全感','工作倦怠','職場八卦'] },
  { n:'第四組', lead:'李若瑄', prefs:['職場八卦','心理安全感','心理資本'] },
  { n:'第五組', lead:'吳秋慧', prefs:['心理安全感','工作倦怠','職場無禮','職場八卦','心理資本','工作敬業'] },
  { n:'第六組', lead:'陳姵妤', prefs:['心理安全感','職場無禮','印象管理','職場八卦'] },
  { n:'第七組', lead:'劉家宏', prefs:['職場無禮','工作倦怠','印象管理'] }
];

/* ── 狀態 ───────────────────────────────────────────── */
var taken = {};        /* 主題 → 組別 */
var result = [];       /* {g, topic, rank} */
var pending = null;    /* 志願序全被選走，等教師手動挑 */
var spinning = false;
var GAP = 2000;        /* 一組抽完之後，隔多久自動抽下一組（毫秒） */
var auto = false;      /* 是否正在連續自動抽 */
var gapT = null;       /* 兩組之間的等待計時器 */

/* 抽籤鍵在三種狀態之間切換：抽籤、暫停、繼續 */
function setGo() {
  var b = $('draw');
  if (pending) { b.textContent = '抽籤'; b.disabled = true; return; }
  if (!remainGroups().length) { b.textContent = '抽籤'; b.disabled = true; return; }
  b.disabled = false;
  b.textContent = auto ? '暫停' : (result.length ? '繼續' : '抽籤');
}

var $ = function (id) { return document.getElementById(id); };
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function remainGroups() {
  var done = {};
  result.forEach(function (r) { done[r.g.n] = 1; });
  return GROUPS.filter(function (g) { return !done[g.n]; });
}
function remainTopics() { return TOPICS.filter(function (t) { return !taken[t]; }); }

/* ── 畫面 ───────────────────────────────────────────── */
var LISTED = {};   /* 主題 → 有幾組把它列入志願序 */
TOPICS.forEach(function (t) {
  LISTED[t] = GROUPS.filter(function (g) { return g.prefs.indexOf(t) >= 0; }).length;
});

function drawTopics() {
  var box = $('topics'); box.innerHTML = '';
  TOPICS.forEach(function (t) {
    var c = document.createElement('div');
    c.className = 'chip' + (taken[t] ? ' taken' : '') + (pending && !taken[t] ? ' pickable' : '');
    var tag = taken[t] ? taken[t] : (LISTED[t] ? LISTED[t] + ' 組列入' : '無人列入');
    c.innerHTML = '<span>' + t + '</span><span class="num">' + tag + '</span>';
    if (pending && !taken[t]) c.onclick = function () {
      assign(pending, t, 0);
      if (remainGroups().length) { auto = true; setGo(); queueNext(); }
    };
    box.appendChild(c);
  });
}

function drawPrefs(nowGroup) {
  var tb = $('ptab').tBodies[0]; tb.innerHTML = '';
  GROUPS.forEach(function (g) {
    var mine = null;
    result.forEach(function (r) { if (r.g.n === g.n) mine = r.topic; });
    var tr = document.createElement('tr');
    if (mine) tr.className = 'done';
    else if (nowGroup && nowGroup.n === g.n) tr.className = 'now';
    var ps = g.prefs.map(function (t) {
      var cls = t === mine ? 'mine' : (taken[t] ? 'used' : '');
      return '<span class="' + cls + '">' + t + '</span>';
    }).join('');
    if (mine && g.prefs.indexOf(mine) < 0) ps += '<span class="mine add">' + mine + '</span>';
    tr.innerHTML = '<td class="g">' + g.n + '</td><td class="lead">' + g.lead +
                   '</td><td class="prefs">' + ps + '</td>';
    tb.appendChild(tr);
  });
}

function drawResult() {
  var tb = $('rtab').tBodies[0]; tb.innerHTML = '';
  result.forEach(function (r, i) {
    var tr = document.createElement('tr');
    tr.innerHTML = '<td class="g">' + (i + 1) + '</td><td class="g">' + r.g.n +
      '</td><td class="lead">' + r.g.lead + '</td><td class="t">' + r.topic +
      '</td><td class="lead">' + (r.rank ? '第 ' + r.rank + ' 志願' : '現場挑選') + '</td>';
    tb.appendChild(tr);
  });
  $('rempty').style.display = result.length ? 'none' : '';
  $('count').textContent = '已抽 ' + result.length + '／' + GROUPS.length + ' 組';
}

function drawRule() {
  var spare = TOPICS.length - GROUPS.length;
  $('thead').textContent = TOPICS.length + ' 個主題';
  $('r3').innerHTML = '<b>一題一組。</b>共 ' + TOPICS.length + ' 個主題、' + GROUPS.length +
    ' 組，被選走的不再開放' + (spare > 0 ? '，最後會有 ' + spare + ' 題沒有用到' : '') + '。';
  $('r2').innerHTML = guardOn()
    ? '<b>依志願序，但會留路。</b>抽到的組取走志願序中最前面還沒被選走的一個；若取走會害後面的組沒有志願內的主題可拿，就往下一個志願。'
    : '<b>依志願序。</b>抽到的組直接取走志願序中還沒被選走的最前面一個，志願全被選走就當場從剩下的主題挑。';
}

function render(nowGroup) { drawTopics(); drawPrefs(nowGroup); drawResult(); }

/* ── 抽籤 ───────────────────────────────────────────── */
function assign(g, topic, rank, blocked, victim) {
  taken[topic] = g.n;
  result.push({ g: g, topic: topic, rank: rank, blocked: blocked || [] });
  pending = null;
  $('got').innerHTML = '取走　<b>' + topic + '</b>' +
    '<span class="rank">' + (rank ? '第 ' + rank + ' 志願' : '現場挑選') + '</span>';
  $('hint').textContent = remainGroups().length
    ? '剩下 ' + remainGroups().length + ' 組。'
    : '全部分完了，可以按複製結果。';

  if (blocked && blocked.length) {
    $('why').innerHTML = '<b>' + blocked.join('、') + '</b> 其實還沒被選走，但是讓 ' + g.n +
      '拿走之後，<b>' + (victim ? victim.n : '後面的組') +
      '</b>就會沒有任何填過的主題可拿，所以往下一個志願。';
    $('why').className = 'why on';
  } else {
    $('why').className = 'why';
  }

  render(null);
  setGo();
  queueNext();
}

/* ── 可行性守門 ──────────────────────────────────────
   二分圖最大匹配。問的問題是：在 used 這些主題已被取走的情況下，
   groups 裡的每一組，是不是都還能配到一個自己填過的主題。
   回傳 null 表示可以；回傳某一組表示那一組會配不到。            */
function strandedBy(groups, used) {
  var owner = {};                       /* 主題 → 暫時配給哪一組 */
  function aug(g, seen) {
    for (var i = 0; i < g.prefs.length; i++) {
      var t = g.prefs[i];
      if (used[t] || seen[t]) continue;
      seen[t] = 1;
      if (!owner[t] || aug(owner[t], seen)) { owner[t] = g; return true; }
    }
    return false;
  }
  for (var i = 0; i < groups.length; i++)
    if (!aug(groups[i], {})) return groups[i];
  return null;
}

/* 開場先確認：這份志願序本身有沒有辦法讓七組都拿到志願內的主題。
   若本來就做不到，守門沒有意義，直接關掉並說明。                */
var FEASIBLE = strandedBy(GROUPS, {}) === null;

function guardOn() { return FEASIBLE && $('guard').checked; }

function settle(g) {
  $('slot').textContent = g.n + '　' + g.lead;
  var rest = remainGroups().filter(function (x) { return x.n !== g.n; });
  var pick = null, rank = 0, blocked = [], victim = null;

  for (var i = 0; i < g.prefs.length; i++) {
    var t = g.prefs[i];
    if (taken[t]) continue;
    if (guardOn()) {
      var trial = {}, k;
      for (k in taken) trial[k] = taken[k];
      trial[t] = g.n;
      var v = strandedBy(rest, trial);
      if (v) { blocked.push(t); if (!victim) victim = v; continue; }
    }
    pick = t; rank = i + 1; break;
  }

  if (pick) {
    assign(g, pick, rank, blocked, victim);
    return;
  }
  pending = g;
  $('got').innerHTML = '<b>志願序已全部被選走</b>';
  $('hint').textContent = '剩下 ' + remainTopics().join('、') + '，請該組當場挑一個，點上方紅框的主題即可。';
  $('why').className = 'why';
  auto = false; clearTimeout(gapT);
  render(g);
  setGo();
}

/* 抽一組。轉盤跑完之後 settle 會接手，settle 裡的 assign 再呼叫 queueNext 排下一組 */
function spinOne() {
  if (spinning) return;
  var pool = remainGroups();
  if (!pool.length) { auto = false; setGo(); return; }
  var win = pool[Math.floor(Math.random() * pool.length)];
  $('got').textContent = ''; $('hint').textContent = '抽籤中⋯'; $('why').className = 'why';
  if (reduce || pool.length === 1) { settle(win); return; }
  spinning = true; $('draw').disabled = true;
  var t = 0, dur = 1100, step = 70, start = Date.now();
  var timer = setInterval(function () {
    var e = pool[t++ % pool.length];
    $('slot').textContent = e.n + '　' + e.lead;
    if (Date.now() - start > dur) {
      clearInterval(timer); spinning = false; settle(win);
    }
  }, step);
}

/* 一組抽完，若仍在自動模式就隔 GAP 毫秒抽下一組 */
function queueNext() {
  clearTimeout(gapT);
  if (!auto) return;
  if (!remainGroups().length) { auto = false; setGo(); return; }
  $('hint').textContent = '剩下 ' + remainGroups().length + ' 組，' +
    (GAP / 1000) + ' 秒後自動抽下一組。';
  gapT = setTimeout(function () { if (auto) spinOne(); }, GAP);
}

/* 抽籤鍵：開始或繼續連抽，再按一次暫停 */
function toggleAuto() {
  if (pending) return;
  if (auto) {
    auto = false; clearTimeout(gapT); setGo();
    $('hint').textContent = '已暫停，按繼續接著抽。';
    return;
  }
  if (!remainGroups().length) return;
  auto = true; setGo(); spinOne();
}

function reset() {
  taken = {}; result = []; pending = null;
  $('slot').innerHTML = '<span class="dim">按下抽籤，決定第 1 順位</span>';
  $('got').textContent = '';
  $('hint').textContent = '按一次抽籤就會從第一組連續抽到最後一組，中途可按暫停。';
  $('why').className = 'why';
  auto = false; spinning = false; clearTimeout(gapT);
  drawRule();
  render(null);
  setGo();
}

$('guard').onchange = function () {
  if (result.length || auto) reset(); else drawRule();
};

if (!FEASIBLE) {
  $('guard').checked = false; $('guard').disabled = true;
  $('warn').className = 'warn on';
  $('warn').textContent = '這份志願序無論怎麼排，都無法讓每一組都拿到自己填過的主題，' +
    '所以保障機制已停用。請先請部分組別把志願序補長，或增加可選主題。';
}

$('draw').onclick = toggleAuto;
$('reset').onclick = function () { if (!result.length || confirm('重新開始，目前的結果會清掉。')) reset(); };
$('copy').onclick = function () {
  if (!result.length) return;
  var lines = ['期末專題選題結果（抽籤順序）'];
  result.forEach(function (r, i) {
    lines.push((i + 1) + '. ' + r.g.n + '（' + r.g.lead + '）→ ' + r.topic +
      '　' + (r.rank ? '第 ' + r.rank + ' 志願' : '現場挑選'));
  });
  var left = remainTopics();
  if (left.length) lines.push('未選走：' + left.join('、'));
  lines.push(guardOn()
    ? '規則：隨機抽出組別順序，每組取走志願序中最前面、且不會讓後面的組無題可選的主題。'
    : '規則：隨機抽出組別順序，每組取走志願序中還沒被選走的最前面一個。');
  var s = lines.join('\n');
  if (navigator.clipboard) navigator.clipboard.writeText(s).then(
    function () { $('hint').textContent = '結果已複製到剪貼簿。'; },
    function () { prompt('複製下面的文字：', s); });
  else prompt('複製下面的文字：', s);
};
document.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;   /* 焦點在按鈕時交給按鈕自己處理，避免抽兩次 */
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!$('draw').disabled) toggleAuto(); }
});
reset();
</script>
</body>
</html>
